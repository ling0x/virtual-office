<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Virtual Office</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; font-family: monospace; }
    #canvas-container { width: 100vw; height: 100vh; }

    /* Name entry modal */
    #name-modal {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.85);
      display: flex; align-items: center; justify-content: center;
      z-index: 100;
    }
    #name-modal.hidden { display: none; }
    #name-modal form {
      background: #1a1a2e;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 32px;
      display: flex; flex-direction: column; gap: 12px;
      min-width: 280px;
    }
    #name-modal h2 { color: #fff; font-size: 1.2rem; }
    #name-modal input {
      padding: 8px 12px;
      border-radius: 4px;
      border: 1px solid #555;
      background: #0f0f1a;
      color: #fff;
      font-size: 1rem;
    }
    #name-modal button {
      padding: 10px;
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1rem;
    }
    #name-modal button:hover { background: #6366f1; }

    /* HUD */
    #hud {
      position: fixed;
      top: 12px; left: 12px;
      color: #ccc;
      font-size: 0.75rem;
      pointer-events: none;
      user-select: none;
    }

    /* Players list */
    #players-panel {
      position: fixed;
      top: 12px; right: 12px;
      background: rgba(0,0,0,0.6);
      border: 1px solid #333;
      border-radius: 6px;
      padding: 8px 12px;
      color: #aaa;
      font-size: 0.75rem;
      min-width: 140px;
    }
    #players-panel h3 { color: #fff; margin-bottom: 6px; }

    /* Chat */
    #chat-panel {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      display: flex; flex-direction: column;
      align-items: flex-start;
      padding: 12px;
      gap: 6px;
      pointer-events: none;
    }
    #chat-log {
      max-height: 160px;
      overflow-y: auto;
      display: flex; flex-direction: column-reverse;
      gap: 3px;
      width: 100%;
      max-width: 480px;
    }
    .chat-line {
      background: rgba(0,0,0,0.6);
      color: #eee;
      font-size: 0.78rem;
      padding: 3px 8px;
      border-radius: 4px;
      word-break: break-word;
    }
    .chat-line .author { color: #818cf8; font-weight: bold; }
    #chat-form {
      display: flex; gap: 6px;
      pointer-events: all;
      width: 100%;
      max-width: 480px;
    }
    #chat-input {
      flex: 1;
      padding: 8px 12px;
      border-radius: 4px;
      border: 1px solid #444;
      background: rgba(0,0,0,0.75);
      color: #fff;
      font-size: 0.9rem;
      outline: none;
    }
    #chat-input:focus { border-color: #6366f1; }
    #chat-form button {
      padding: 8px 14px;
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="name-modal">
    <form id="name-form">
      <h2>Enter Virtual Office</h2>
      <input id="name-input" type="text" placeholder="Your name" maxlength="24" autocomplete="off" />
      <button type="submit">Join</button>
    </form>
  </div>

  <div id="canvas-container"></div>

  <div id="hud">
    <div id="hud-name"></div>
    <div id="hud-seed"></div>
    <div style="margin-top:6px;opacity:0.6">WASD / Arrow Keys to move</div>
  </div>

  <div id="players-panel">
    <h3>Online</h3>
    <div id="players-list"></div>
  </div>

  <div id="chat-panel">
    <div id="chat-log"></div>
    <form id="chat-form">
      <input id="chat-input" type="text" placeholder="Press Enter to chat..." maxlength="200" autocomplete="off" />
      <button type="submit">Send</button>
    </form>
  </div>

  <script type="module" src="/main.js"></script>
</body>
</html>
